name: Release checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      MAIL_USERNAME: ci@example.com
      MAIL_DEFAULT_SENDER: ci@example.com
      MAIL_PASSWORD: ci-test-password

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q src

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run browser JavaScript tests
        run: node --test tests/*.cjs

      - name: Check diff whitespace
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$DIFF_BASE_SHA" "$GITHUB_SHA"

      - name: Build Docker image
        run: docker build --tag resumewebsite:ci .
